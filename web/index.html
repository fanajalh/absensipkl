<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Aplikasi Absensi Digital Siswa PKL — PT fanajalh.id">
  <meta name="theme-color" content="#1FA2FF">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Absensi PKL">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Absensi PKL</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #29AAFF 0%, #1594F5 100%);
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #pre-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #29AAFF 0%, #1594F5 100%);
      z-index: 9999;
      transition: opacity 220ms ease-out;
    }
    #pre-splash.hide {
      opacity: 0;
      pointer-events: none;
    }
    .splash-badge {
      width: 84px;
      height: 84px;
      border-radius: 26px;
      background: #FFFFFF;
      border: 1.5px solid rgba(255, 255, 255, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }
    .splash-title {
      color: #FFFFFF;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin: 0 0 4px;
    }
    .splash-sub {
      color: rgba(255, 255, 255, 0.84);
      font-size: 13px;
      font-weight: 500;
      margin: 0;
    }
  </style>
</head>
<body>
  <div id="pre-splash" aria-label="Memuat Absensi PKL">
    <div class="splash-badge">
      <svg width="56" height="56" viewBox="0 0 128 128" fill="none" aria-hidden="true">
        <circle cx="62" cy="54" r="41" stroke="#1FA2FF" stroke-opacity="0.26" stroke-width="3.2" stroke-dasharray="7 6"/>
        <path d="M62 18C42.67 18 27 33.67 27 53C27 78.2 62 106 62 106C62 106 97 78.2 97 53C97 33.67 81.33 18 62 18Z" fill="#1FA2FF"/>
        <circle cx="62" cy="52" r="15" fill="#FFFFFF"/>
        <circle cx="62" cy="52" r="6.5" fill="#1FA2FF"/>
        <circle cx="90" cy="88" r="22" fill="#FFFFFF"/>
        <circle cx="90" cy="88" r="18" fill="#F6C324"/>
        <path d="M82.2 88.2L87.5 93.5L98 83" stroke="#14161A" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <p class="splash-title">Absensi PKL</p>
    <p class="splash-sub">PT fanajalh.id</p>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('pre-splash');
      if (!el) return;
      el.classList.add('hide');
      setTimeout(function () { el.remove(); }, 260);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
